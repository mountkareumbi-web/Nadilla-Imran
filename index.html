<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Multi-Device Console</title>
    <!-- Include PeerJS & QRCode Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #0d1117; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* MENU SELECTION */
        #menu-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #161b22; padding: 30px; border-radius: 20px; border: 3px solid #f1c40f; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 90%; max-width: 450px; text-align: center; }
        #menu-screen h1 { color: #f1c40f; font-size: 28px; margin-bottom: 5px; text-shadow: 2px 2px #c0392b; }
        #menu-screen h2 { color: #e74c3c; font-size: 14px; margin-bottom: 25px; letter-spacing: 2px; }
        .btn-mode { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; color: white; transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center; }
        .btn-mode:active { transform: scale(0.98); }
        .btn-display { background: linear-gradient(135deg, #2980b9, #3498db); box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }
        .btn-p1 { background: linear-gradient(135deg, #c0392b, #e74c3c); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        .btn-p2 { background: linear-gradient(135deg, #27ae60, #2ecc71); box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }
        .btn-mode:disabled { background: #555 !important; cursor: not-allowed; box-shadow: none; opacity: 0.6; }

        /* LAPTOP DISPLAY */
        #display-screen { display: none; flex-direction: column; align-items: center; width: 100vw; height: 100vh; background: #5c94fc; position: relative; }
        #canvas-container { position: relative; margin-top: 10px; border: 4px solid #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        canvas { background: #5c94fc; display: block; }
        #qr-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        #qr-box { background: white; padding: 20px; border-radius: 15px; display: flex; gap: 20px; text-align: center; color: #333; }
        .qr-card { display: flex; flex-direction: column; align-items: center; }
        
        /* HP CONTROLLER */
        #controller-screen { display: none; width: 100vw; height: 100vh; background: #222; position: relative; flex-direction: row; justify-content: space-between; align-items: center; padding: 20px 40px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }
        .dbtn { background: #444; border: 2px solid #666; border-radius: 10px; color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; touch-action: manipulation; }
        .dbtn:active { background: #888; }
        .dbtn-up { grid-column: 2; grid-row: 1; }
        .dbtn-left { grid-column: 1; grid-row: 2; }
        .dbtn-right { grid-column: 3; grid-row: 2; }
        .dbtn-down { grid-column: 2; grid-row: 3; }

        .action-buttons { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }
        .abtn { border-radius: 50%; color: white; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; border: 2px solid rgba(255,255,255,0.3); touch-action: manipulation; }
        .abtn:active { filter: brightness(1.5); }
        .abtn-triangle { grid-column: 2; grid-row: 1; background: #2ecc71; }
        .abtn-square { grid-column: 1; grid-row: 2; background: #f1c40f; }
        .abtn-circle { grid-column: 3; grid-row: 2; background: #e74c3c; }
        .abtn-cross { grid-column: 2; grid-row: 3; background: #3498db; }

        #status-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- MENU SCREEN -->
    <div id="menu-screen">
        <h1>SUPER MARIO</h1>
        <h2>MULTI-DEVICE CONSOLE</h2>
        <p style="font-size: 12px; margin-bottom: 15px; color: #aaa;">Pilih mode perangkat ini:</p>
        <button class="btn-mode btn-display" onclick="startDisplay()">
            <span>💻 Display (Laptop / TV)</span>
        </button>
        <button id="btn-p1" class="btn-mode btn-p1" onclick="startController(1)">
            <span>📱 Stick Player 1 (Mario)</span> <small id="status-p1">Ready</small>
        </button>
        <button id="btn-p2" class="btn-mode btn-p2" onclick="startController(2)">
            <span>📱 Stick Player 2 (Luigi)</span> <small id="status-p2">Ready</small>
        </button>
    </div>

    <!-- LAPTOP DISPLAY SCREEN -->
    <div id="display-screen">
        <div id="qr-modal">
            <h2 style="margin-bottom: 15px; color: #f1c40f;">SCAN QR CODE DENGAN HP</h2>
            <div id="qr-box">
                <div class="qr-card">
                    <div id="qrcode-p1"></div>
                    <b style="color: #e74c3c; margin-top: 5px;">Player 1 (Mario)</b>
                    <span id="p1-state">Menunggu HP 1...</span>
                </div>
                <div class="qr-card">
                    <div id="qrcode-p2"></div>
                    <b style="color: #2ecc71; margin-top: 5px;">Player 2 (Luigi)</b>
                    <span id="p2-state">Menunggu HP 2...</span>
                </div>
            </div>
            <p style="margin-top: 15px; font-size: 14px; color: #ccc;">Atau buka URL ini di HP dan masukkan ID Room.</p>
            <button onclick="closeQRModal()" style="margin-top: 15px; padding: 10px 20px; border-radius: 8px; border: none; background: #f1c40f; font-weight: bold; cursor: pointer;">Mulai Game Tanpa Tunggu</button>
        </div>
        <div id="canvas-container">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>
    </div>

    <!-- HP CONTROLLER SCREEN -->
    <div id="controller-screen">
        <div id="status-bar">Terhubung sebagai: <b id="player-tag">-</b></div>
        
        <!-- DPAD (KIRI) -->
        <div class="dpad">
            <div class="dbtn dbtn-up" data-key="up">▲</div>
            <div class="dbtn dbtn-left" data-key="left">◀</div>
            <div class="dbtn dbtn-right" data-key="right">▶</div>
            <div class="dbtn dbtn-down" data-key="down">▼</div>
        </div>

        <!-- ACTION BUTTONS (KANAN) -->
        <div class="action-buttons">
            <div class="abtn abtn-triangle" data-key="triangle">▲</div>
            <div class="abtn abtn-square" data-key="square">■</div>
            <div class="abtn abtn-circle" data-key="circle">●</div>
            <div class="abtn abtn-cross" data-key="cross">✖</div>
        </div>
    </div>

    <script>
        // PEERJS SETUP & GLOBAL VARIABLES
        let peer = null;
        let connections = { p1: null, p2: null };
        let roomID = Math.random().toString(36).substring(2, 8).toUpperCase();
        let currentMode = '';

        // Web Audio Synthesizer (Retro Sound Effects)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        // --- 1. DISPLAY (LAPTOP ENGINE) ---
        function startDisplay() {
            currentMode = 'display';
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('display-screen').style.display = 'flex';

            const displayPeerId = 'MARIO-ROOM-' + roomID;
            peer = new Peer(displayPeerId);

            peer.on('open', (id) => {
                const currentURL = window.location.href.split('?')[0];
                const urlP1 = `${currentURL}?room=${displayPeerId}&player=1`;
                const urlP2 = `${currentURL}?room=${displayPeerId}&player=2`;

                new QRCode(document.getElementById("qrcode-p1"), { text: urlP1, width: 128, height: 128 });
                new QRCode(document.getElementById("qrcode-p2"), { text: urlP2, width: 128, height: 128 });
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'REGISTER') {
                        if (data.player === 1 && !connections.p1) {
                            connections.p1 = conn;
                            document.getElementById('p1-state').innerText = "✅ TERHUBUNG";
                            document.getElementById('p1-state').style.color = "green";
                            conn.send({ type: 'REGISTER_SUCCESS', player: 1 });
                        } else if (data.player === 2 && !connections.p2) {
                            connections.p2 = conn;
                            document.getElementById('p2-state').innerText = "✅ TERHUBUNG";
                            document.getElementById('p2-state').style.color = "green";
                            conn.send({ type: 'REGISTER_SUCCESS', player: 2 });
                        } else {
                            conn.send({ type: 'SLOT_FULL' });
                        }
                    }

                    if (data.type === 'INPUT') {
                        handleInput(data.player, data.key, data.state);
                    }
                });

                conn.on('close', () => {
                    if (connections.p1 === conn) { connections.p1 = null; document.getElementById('p1-state').innerText = "Terputus"; }
                    if (connections.p2 === conn) { connections.p2 = null; document.getElementById('p2-state').innerText = "Terputus"; }
                });
            });

            initGameEngine();
        }

        function closeQRModal() {
            document.getElementById('qr-modal').style.display = 'none';
        }

        // --- 2. CONTROLLER (HP) ---
        function startController(playerNum) {
            const urlParams = new URLSearchParams(window.location.search);
            let targetRoom = urlParams.get('room');

            if (!targetRoom) {
                targetRoom = prompt("Masukkan Kode Room dari Laptop (misal: MARIO-ROOM-XXXXXX):");
                if (!targetRoom) return;
            }

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('controller-screen').style.display = 'flex';
            document.getElementById('player-tag').innerText = `Player ${playerNum} (${playerNum === 1 ? 'Mario' : 'Luigi'})`;
            document.getElementById('player-tag').style.color = playerNum === 1 ? '#e74c3c' : '#2ecc71';

            peer = new Peer();

            peer.on('open', () => {
                const conn = peer.connect(targetRoom);
                
                conn.on('open', () => {
                    conn.send({ type: 'REGISTER', player: playerNum });
                });

                conn.on('data', (data) => {
                    if (data.type === 'SLOT_FULL') {
                        alert("Slot player ini sudah terisi oleh HP lain!");
                        window.location.href = window.location.pathname;
                    }
                });

                setupTouchControls(conn, playerNum);
            });
        }

        function setupTouchControls(conn, playerNum) {
            const buttons = document.querySelectorAll('.dbtn, .abtn');
            buttons.forEach(btn => {
                const key = btn.getAttribute('data-key');

                const sendAction = (state) => {
                    if (conn && conn.open) {
                        conn.send({ type: 'INPUT', player: playerNum, key: key, state: state });
                    }
                };

                btn.addEventListener('touchstart', (e) => { e.preventDefault(); sendAction(true); });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); sendAction(false); });
                btn.addEventListener('mousedown', () => sendAction(true));
                btn.addEventListener('mouseup', () => sendAction(false));
            });
        }

        // --- 3. GAME ENGINE (SUPER MARIO 2D) ---
        const players = {
            1: { x: 50, y: 300, vx: 0, vy: 0, width: 24, height: 32, color: '#e74c3c', grounded: false, score: 0 },
            2: { x: 90, y: 300, vx: 0, vy: 0, width: 24, height: 32, color: '#2ecc71', grounded: false, score: 0 }
        };

        const inputs = {
            1: { left: false, right: false, up: false, cross: false },
            2: { left: false, right: false, up: false, cross: false }
        };

        const levelBlocks = [
            { x: 0, y: 350, w: 2000, h: 50, type: 'ground' },
            { x: 200, y: 250, w: 40, h: 40, type: 'block' },
            { x: 240, y: 250, w: 40, h: 40, type: 'coin-block', active: true },
            { x: 280, y: 250, w: 40, h: 40, type: 'block' },
            { x: 450, y: 200, w: 100, h: 20, type: 'platform' }
        ];

        function handleInput(playerNum, key, state) {
            if (inputs[playerNum]) {
                inputs[playerNum][key] = state;
            }
        }

        function initGameEngine() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const gravity = 0.5;

            function update() {
                [1, 2].forEach(pId => {
                    const p = players[pId];
                    const input = inputs[pId];

                    // Movement
                    if (input.left) p.vx = -4;
                    else if (input.right) p.vx = 4;
                    else p.vx = 0;

                    // Jump (Tombol Atas atau Cross / Kali)
                    if ((input.up || input.cross) && p.grounded) {
                        p.vy = -11;
                        p.grounded = false;
                        playSound('jump');
                    }

                    p.vy += gravity;
                    p.x += p.vx;
                    p.y += p.vy;

                    // Collision with ground/blocks
                    p.grounded = false;
                    levelBlocks.forEach(b => {
                        if (p.x < b.x + b.w && p.x + p.width > b.x && p.y < b.y + b.h && p.y + p.height > b.y) {
                            if (p.vy > 0 && p.y + p.height - p.vy <= b.y) {
                                p.y = b.y - p.height;
                                p.vy = 0;
                                p.grounded = true;
                            }
                        }
                    });

                    // Bounds
                    if (p.x < 0) p.x = 0;
                });

                // Render
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Blocks
                levelBlocks.forEach(b => {
                    ctx.fillStyle = b.type === 'ground' ? '#c0392b' : '#f39c12';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = '#000';
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                });

                // Draw Players
                [1, 2].forEach(pId => {
                    const p = players[pId];
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(p.x + 14, p.y + 6, 6, 6);
                });

                requestAnimationFrame(update);
            }

            update();
        }

        // Auto Detect Parameters (Jika discan dari QR Code)
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const playerParam = urlParams.get('player');
            if (playerParam) {
                startController(parseInt(playerParam));
            }
        };
    </script>
</body>
</html>
