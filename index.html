<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fireboy & Watergirl Easy Controller</title>
    <!-- PeerJS untuk koneksi antar HP dan Laptop -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- Library QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #121212; color: #fff; text-align: center; font-family: Arial, sans-serif; margin: 0; padding: 15px; user-select: none; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 12px; display: inline-block; margin-top: 15px; max-width: 400px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        h1 { font-size: 20px; color: #ffcc00; }
        h3 { font-size: 16px; color: #00d2ff; }
        .status { margin-top: 15px; font-weight: bold; color: #ff4d4d; font-size: 15px; }
        .connected { color: #28a745 !important; }
        
        /* Tampilan Stik di HP */
        #controller-ui { display: none; margin-top: 10px; }
        .controller-grid { display: grid; grid-template-columns: repeat(3, 85px); grid-template-rows: repeat(2, 85px); gap: 12px; justify-content: center; margin-top: 25px; }
        .ctrl-btn { background: #007bff; color: white; font-size: 20px; font-weight: bold; border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px #004085; -webkit-tap-highlight-color: transparent; }
        .ctrl-btn:active, .ctrl-btn.pressed { background: #004085; transform: translateY(3px); box-shadow: 0 1px #002752; }
        .empty { visibility: hidden; }
        #qrcode { background: white; padding: 10px; display: inline-block; border-radius: 8px; margin-top: 10px; }
        a { color: #4da6ff; word-break: break-all; font-size: 13px; }
    </style>
</head>
<body>

    <h1>🎮 Fireboy & Watergirl Controller</h1>

    <!-- TAMPILAN LAPTOP (HOST) -->
    <div class="box" id="laptop-view">
        <h3>Hubungkan HP untuk Watergirl</h3>
        <p style="font-size: 13px; color: #ccc;">Scan QR Code di bawah ini menggunakan kamera HP Anda:</p>
        <div id="qrcode"></div>
        <p style="font-size: 12px; margin-top: 10px;">Atau buka link ini di HP:</p>
        <a id="controller-link" href="#" target="_blank">Memuat link...</a>
        <div class="status" id="host-status">Status: Menunggu HP terhubung...</div>
    </div>

    <!-- TAMPILAN STIK DI HP -->
    <div id="controller-ui" class="box">
        <h3 style="color: #00d2ff; margin: 0;">💧 WATERGIRL CONTROLLER</h3>
        <p class="status connected" style="margin: 5px 0 15px 0;">Terhubung ke Laptop! ✅</p>
        <div class="controller-grid">
            <div class="empty"></div>
            <button class="ctrl-btn" data-key="w">W<br>▲</button>
            <div class="empty"></div>
            
            <button class="ctrl-btn" data-key="a">A<br>◄</button>
            <button class="ctrl-btn" data-key="s">S<br>▼</button>
            <button class="ctrl-btn" data-key="d">D<br>►</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');

        const myId = roomParam || ('fw-' + Math.random().toString(36).substring(2, 7));
        const peer = new Peer(myId);
        let connection = null;

        peer.on('open', (id) => {
            if (!roomParam) {
                // TAMPILAN DI LAPTOP
                const currentUrl = window.location.href.split('?')[0];
                const targetLink = currentUrl + '?room=' + id;
                
                const linkEl = document.getElementById('controller-link');
                linkEl.href = targetLink;
                linkEl.innerText = targetLink;

                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: targetLink,
                    width: 150,
                    height: 150
                });
            } else {
                // TAMPILAN OTOMATIS DI HP
                document.getElementById('laptop-view').style.display = 'none';
                
                connection = peer.connect(roomParam);
                
                connection.on('open', () => {
                    document.getElementById('controller-ui').style.display = 'block';
                });
            }
        });

        peer.on('connection', (conn) => {
            connection = conn;
            const statusEl = document.getElementById('host-status');
            statusEl.innerText = "Status: HP Terhubung! ✅ (Silakan mainkan gamenya)";
            statusEl.className = "status connected";

            conn.on('data', (data) => {
                simulateKeyboard(data.key, data.action);
            });
        });

        const buttons = document.querySelectorAll('.ctrl-btn');
        buttons.forEach(btn => {
            const key = btn.getAttribute('data-key');

            ['touchstart', 'mousedown'].forEach(evt => {
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    btn.classList.add('pressed');
                    if (connection && connection.open) {
                        connection.send({ key: key, action: 'down' });
                    }
                });
            });

            ['touchend', 'mouseup', 'mouseleave'].forEach, evt => {
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    btn.classList.remove('pressed');
                    if (connection && connection.open) {
                        connection.send({ key: key, action: 'up' });
                    }
                });
            });
        });

        function simulateKeyboard(key, action) {
            const eventType = action === 'down' ? 'keydown' : 'keyup';
            let code = 'Key' + key.toUpperCase();

            const evt = new KeyboardEvent(eventType, {
                key: key,
                code: code,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(evt);
            window.dispatchEvent(evt);
        }
    </script>
</body>
</html>
