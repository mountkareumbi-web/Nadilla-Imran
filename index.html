<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Mario Bros - Web Remote Multiplayer</title>
    <!-- Firebase Realtime Database Client -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Courier New', Courier, monospace;
            color: white;
        }

        /* SCREEN 1: SELECTION MENU */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
        }
        .title {
            font-size: 2.5rem;
            color: #f59e0b;
            margin-bottom: 10px;
            text-shadow: 3px 3px #000;
        }
        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .room-box {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .room-box input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fbbf24;
            padding: 8px 12px;
            font-size: 1.1rem;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            width: 140px;
        }
        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-role {
            padding: 18px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 200px;
        }
        .btn-role:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
        .btn-display { background: #2563eb; color: white; }
        .btn-multiplayer { background: #16a34a; color: white; }
        .btn-subtext { font-size: 0.75rem; opacity: 0.8; font-weight: normal; }

        /* SCREEN 2: MULTIPLAYER SLOT SELECTION (HP) */
        #slot-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0f172a;
            padding: 20px;
        }
        .slot-btn {
            width: 100%;
            max-width: 320px;
            padding: 20px;
            margin: 12px 0;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.5);
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.5);
        }
        .slot-p1 { background: #dc2626; color: white; }
        .slot-p2 { background: #16a34a; color: white; }
        .slot-btn:disabled {
            background: #475569 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
        }

        /* SCREEN 3: DISPLAY LAPTOP (FULL SCREEN RESPONSIVE) */
        #display-screen {
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        .hud-bar {
            height: 48px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 0.85rem;
            border-bottom: 2px solid #1f2937;
            z-index: 10;
        }
        .hud-status { display: flex; gap: 20px; }
        .player-tag { padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        .p1-tag { background: rgba(220, 38, 38, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .p2-tag { background: rgba(22, 163, 74, 0.2); color: #22c55e; border: 1px solid #22c55e; }
        
        #canvas-wrapper {
            flex: 1;
            width: 100%;
            height: calc(100vh - 48px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #5c94fc;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Memastikan tampilan tidak terpotong! */
            image-rendering: pixelated;
        }

        /* SCREEN 4: HP CONTROLLER LANDSCAPE STICK */
        #controller-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #18181b;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }
        .controller-header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .fullscreen-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* D-PAD LANDSCAPE (KIRI) */
        .dpad-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 170px;
            height: 170px;
        }
        .dpad-btn {
            position: absolute;
            background: #3f3f46;
            border: 2px solid #52525b;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #e4e4e7;
            border-radius: 8px;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: #71717a;
            border-color: #a1a1aa;
        }
        .dpad-up    { top: 0; left: 56px; width: 58px; height: 60px; }
        .dpad-down  { bottom: 0; left: 56px; width: 58px; height: 60px; }
        .dpad-left  { top: 56px; left: 0; width: 60px; height: 58px; }
        .dpad-right { top: 56px; right: 0; width: 60px; height: 58px; }
        .dpad-center{ top: 56px; left: 56px; width: 58px; height: 58px; background: #27272a; border: none; }

        /* ACTION BUTTONS (KANAN: Segitiga, Kotak, Kali, Bundar) */
        .action-container {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 170px;
            height: 170px;
        }
        .act-btn {
            position: absolute;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            color: white;
        }
        .act-btn:active, .act-btn.active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.5);
        }
        /* Layout Diamond */
        .btn-triangle { top: 0; left: 58px; background: #10b981; } /* Segitiga / Atas */
        .btn-square   { top: 58px; left: 0; background: #ec4899; }  /* Kotak / Kiri */
        .btn-circle   { top: 58px; right: 0; background: #ef4444; } /* Bundar / Kanan */
        .btn-cross    { bottom: 0; left: 58px; background: #3b82f6; } /* Kali / Bawah */

        /* Orientation Alert untuk HP */
        #orientation-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 600px) and (orientation: portrait) {
            .mobile-mode #orientation-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: MENU UTAMA -->
    <div id="menu-screen">
        <h1 class="title">SUPER MARIO BROS</h1>
        <p class="subtitle">Multi-Device Remote Web Controller</p>
        
        <div class="room-box">
            <label for="room-id">Kode Room:</label>
            <input type="text" id="room-id" value="MARIO1" maxlength="8">
        </div>

        <div class="btn-container">
            <button class="btn-role btn-display" onclick="selectRole('display')">
                💻 TOMBOL DISPLAY
                <span class="btn-subtext">(Untuk Layar Laptop)</span>
            </button>
            <button class="btn-role btn-multiplayer" onclick="selectRole('multiplayer')">
                📱 MULTIPLAYER
                <span class="btn-subtext">(Untuk HP Controller)</span>
            </button>
        </div>
    </div>

    <!-- SCREEN 2: PILIH SLOT STICK (HP) -->
    <div id="slot-screen">
        <h2 style="margin-bottom: 5px; color: #f59e0b;">PILIH STICK PLAYER</h2>
        <p style="color: #94a3b8; margin-bottom: 20px; font-size: 0.9rem;">Room: <span id="slot-room-display" style="color:white; font-weight:bold;"></span></p>

        <button id="btn-slot-p1" class="slot-btn slot-p1" onclick="claimSlot('p1')">
            <span>🎮 STICK 1 (PLAYER 1)</span>
            <span id="badge-p1" class="status-badge">MEMUAT...</span>
        </button>

        <button id="btn-slot-p2" class="slot-btn slot-p2" onclick="claimSlot('p2')">
            <span>🎮 STICK 2 (PLAYER 2)</span>
            <span id="badge-p2" class="status-badge">MEMUAT...</span>
        </button>

        <p id="slot-error" style="color: #ef4444; margin-top: 15px; font-size: 0.85rem; height: 20px;"></p>
    </div>

    <!-- SCREEN 3: DISPLAY GAME (LAPTOP) -->
    <div id="display-screen">
        <div class="hud-bar">
            <div>ROOM: <span id="hud-room" style="color: #f59e0b; font-weight: bold;"></span></div>
            <div class="hud-status">
                <div id="p1-status" class="player-tag p1-tag">P1: DISCONNECTED</div>
                <div id="p2-status" class="player-tag p2-tag">P2: DISCONNECTED</div>
            </div>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">Full Screen</button>
        </div>
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>
    </div>

    <!-- SCREEN 4: CONTROLLER STICK (HP) -->
    <div id="controller-screen">
        <div class="controller-header">
            <span id="stick-title">STICK PLAYER</span>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">Layar Penuh</button>
        </div>

        <!-- D-PAD KIRI -->
        <div class="dpad-container">
            <div class="dpad-btn dpad-up" data-key="up">▲</div>
            <div class="dpad-btn dpad-left" data-key="left">◀</div>
            <div class="dpad-btn dpad-center"></div>
            <div class="dpad-btn dpad-right" data-key="right">▶</div>
            <div class="dpad-btn dpad-down" data-key="down">▼</div>
        </div>

        <!-- ACTION KANAN -->
        <div class="action-container">
            <div class="act-btn btn-triangle" data-key="triangle">▲</div>
            <div class="act-btn btn-square" data-key="square">■</div>
            <div class="act-btn btn-circle" data-key="circle">●</div>
            <div class="act-btn btn-cross" data-key="cross">✖</div>
        </div>
    </div>

    <!-- WARNING ROTASI HP -->
    <div id="orientation-warning">
        <div style="font-size: 3rem; margin-bottom: 10px;">🔄</div>
        <h3>MOHON PUTAR HP KE LANDSCAPE</h3>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 10px;">Pegang HP secara mendatar untuk menggunakan gamepad.</p>
    </div>

    <script>
        // --- 1. FIREBASE REALTIME DATABASE SYNC (PUBLIC FREE DEMO BACKEND) ---
        const firebaseConfig = {
            databaseURL: "https://mario-remote-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        // Fallback Simulasi jika Firebase offline/gagal
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase initialized in broadcast channel mode.");
        }

        // BroadcastChannel fallback untuk lokal test di browser yang sama
        const localBC = new BroadcastChannel('mario_game_channel');

        let currentRoom = "MARIO1";
        let assignedPlayer = null; // 'p1' atau 'p2'
        let isDisplay = false;

        // State input player (P1 & P2)
        const inputs = {
            p1: { left: false, right: false, up: false, down: false, action: false },
            p2: { left: false, right: false, up: false, down: false, action: false }
        };

        // --- 2. LOGIKA ROLE & SELEKSI SLOT ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function selectRole(role) {
            const roomInput = document.getElementById('room-id').value.trim().toUpperCase();
            if(!roomInput) return alert("Masukkan Kode Room!");
            currentRoom = roomInput;

            document.getElementById('menu-screen').style.display = 'none';

            if(role === 'display') {
                isDisplay = true;
                document.getElementById('display-screen').style.display = 'flex';
                document.getElementById('hud-room').innerText = currentRoom;
                toggleFullScreen();
                initDisplayGame();
            } else {
                document.body.classList.add('mobile-mode');
                document.getElementById('slot-screen').style.display = 'flex';
                document.getElementById('slot-room-display').innerText = currentRoom;
                listenSlotStatus();
            }
        }

        // Pantau ketersediaan slot HP
        function listenSlotStatus() {
            if (db) {
                db.ref(`rooms/${currentRoom}/slots`).on('value', snapshot => {
                    const slots = snapshot.val() || {};
                    updateSlotUI(slots);
                });
            } else {
                updateSlotUI({});
            }
        }

        function updateSlotUI(slots) {
            const btnP1 = document.getElementById('btn-slot-p1');
            const btnP2 = document.getElementById('btn-slot-p2');
            const badgeP1 = document.getElementById('badge-p1');
            const badgeP2 = document.getElementById('badge-p2');

            // Slot P1
            if (slots.p1 && slots.p1.connected) {
                btnP1.disabled = true;
                badgeP1.innerText = "TERISI (FULL)";
            } else {
                btnP1.disabled = false;
                badgeP1.innerText = "TERSEDIA";
            }

            // Slot P2
            if (slots.p2 && slots.p2.connected) {
                btnP2.disabled = true;
                badgeP2.innerText = "TERISI (FULL)";
            } else {
                btnP2.disabled = false;
                badgeP2.innerText = "TERSEDIA";
            }
        }

        function claimSlot(playerSlot) {
            toggleFullScreen();
            
            if (db) {
                const slotRef = db.ref(`rooms/${currentRoom}/slots/${playerSlot}`);
                slotRef.get().then(snapshot => {
                    const val = snapshot.val();
                    if (val && val.connected) {
                        document.getElementById('slot-error').innerText = `Slot Stick ${playerSlot.toUpperCase()} sudah diisi orang lain!`;
                    } else {
                        // Kunci Slot
                        slotRef.set({ connected: true, time: Date.now() });
                        slotRef.onDisconnect().remove();
                        startController(playerSlot);
                    }
                }).catch(() => startController(playerSlot));
            } else {
                startController(playerSlot);
            }
        }

        // --- 3. CONTROLLER STICK HP (LANDSCAPE) ---
        function startController(playerSlot) {
            assignedPlayer = playerSlot;
            document.getElementById('slot-screen').style.display = 'none';
            document.getElementById('controller-screen').style.display = 'block';
            
            const titleEl = document.getElementById('stick-title');
            titleEl.innerText = playerSlot === 'p1' ? '🎮 STICK 1 (MARIO)' : '🎮 STICK 2 (LUIGI)';
            titleEl.style.color = playerSlot === 'p1' ? '#ef4444' : '#22c55e';

            setupTouchControls();
        }

        function sendInputState(key, isPressed) {
            if(!assignedPlayer) return;

            const payload = { player: assignedPlayer, key: key, pressed: isPressed };

            // Kirim via Firebase
            if (db) {
                db.ref(`rooms/${currentRoom}/inputs/${assignedPlayer}/${key}`).set(isPressed);
            }
            // Kirim via Local BroadcastChannel
            localBC.postMessage(payload);
        }

        function setupTouchControls() {
            const buttons = document.querySelectorAll('.dpad-btn, .act-btn');

            buttons.forEach(btn => {
                const key = btn.getAttribute('data-key');
                if(!key) return;

                const handleStart = (e) => {
                    e.preventDefault();
                    btn.classList.add('active');
                    if (navigator.vibrate) navigator.vibrate(15);
                    mapAndSend(key, true);
                };

                const handleEnd = (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    mapAndSend(key, false);
                };

                btn.addEventListener('touchstart', handleStart, {passive: false});
                btn.addEventListener('touchend', handleEnd, {passive: false});
                btn.addEventListener('mousedown', handleStart);
                btn.addEventListener('mouseup', handleEnd);
            });
        }

        function mapAndSend(key, isPressed) {
            // Mapping Tombol D-Pad & Action
            if (key === 'left') sendInputState('left', isPressed);
            if (key === 'right') sendInputState('right', isPressed);
            if (key === 'up' || key === 'cross' || key === 'triangle') sendInputState('up', isPressed); // Melompat
            if (key === 'square' || key === 'circle') sendInputState('action', isPressed); // Berlari / Aksi
        }

        // --- 4. ENGINE GAME SUPER MARIO 2D (LAPTOP DISPLAY) ---
        function initDisplayGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // Sinkronisasi Input dari Firebase
            if(db) {
                db.ref(`rooms/${currentRoom}/slots`).on('value', snap => {
                    const slots = snap.val() || {};
                    const p1El = document.getElementById('p1-status');
                    const p2El = document.getElementById('p2-status');

                    if(slots.p1 && slots.p1.connected) {
                        p1El.innerText = "P1: STICK CONNECTED (HP)";
                        p1El.style.background = "rgba(220, 38, 38, 0.8)";
                        p1El.style.color = "#fff";
                    } else {
                        p1El.innerText = "P1: KEYBOARD (A/D/W) / WAITING HP";
                        p1El.style.background = "rgba(220, 38, 38, 0.2)";
                        p1El.style.color = "#ef4444";
                    }

                    if(slots.p2 && slots.p2.connected) {
                        p2El.innerText = "P2: STICK CONNECTED (HP)";
                        p2El.style.background = "rgba(22, 163, 74, 0.8)";
                        p2El.style.color = "#fff";
                    } else {
                        p2El.innerText = "P2: KEYBOARD (ARROWS) / WAITING HP";
                        p2El.style.background = "rgba(22, 163, 74, 0.2)";
                        p2El.style.color = "#22c55e";
                    }
                });

                db.ref(`rooms/${currentRoom}/inputs`).on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        if(data.p1) Object.assign(inputs.p1, data.p1);
                        if(data.p2) Object.assign(inputs.p2, data.p2);
                    }
                });
            }

            // Channel Lokal Fallback
            localBC.onmessage = (e) => {
                const { player, key, pressed } = e.data;
                if(inputs[player]) inputs[player][key] = pressed;
            };

            // Keyboard Fallback (Laptop dapat dimainkan langsung)
            window.addEventListener('keydown', e => {
                // Player 1: WASD
                if(e.code === 'KeyA') inputs.p1.left = true;
                if(e.code === 'KeyD') inputs.p1.right = true;
                if(e.code === 'KeyW') inputs.p1.up = true;

                // Player 2: Panah
                if(e.code === 'ArrowLeft') inputs.p2.left = true;
                if(e.code === 'ArrowRight') inputs.p2.right = true;
                if(e.code === 'ArrowUp') inputs.p2.up = true;
            });

            window.addEventListener('keyup', e => {
                if(e.code === 'KeyA') inputs.p1.left = false;
                if(e.code === 'KeyD') inputs.p1.right = false;
                if(e.code === 'KeyW') inputs.p1.up = false;

                if(e.code === 'ArrowLeft') inputs.p2.left = false;
                if(e.code === 'ArrowRight') inputs.p2.right = false;
                if(e.code === 'ArrowUp') inputs.p2.up = false;
            });

            // Entitas Game
            const gravity = 0.5;

            class Player {
                constructor(x, color, name) {
                    this.x = x;
                    this.y = 200;
                    this.width = 24;
                    this.height = 32;
                    this.vx = 0;
                    this.vy = 0;
                    this.color = color;
                    this.name = name;
                    this.grounded = false;
                    this.score = 0;
                    this.lives = 3;
                }

                update(inputState, platforms) {
                    // Pergerakan
                    if (inputState.left) this.vx = -3.5;
                    else if (inputState.right) this.vx = 3.5;
                    else this.vx = 0;

                    if (inputState.up && this.grounded) {
                        this.vy = -11;
                        this.grounded = false;
                    }

                    // Gravitasi
                    this.vy += gravity;
                    this.x += this.vx;
                    this.y += this.vy;

                    // Tabrakan dengan Platform/Tanah
                    this.grounded = false;
                    for (let p of platforms) {
                        if (this.x < p.x + p.w &&
                            this.x + this.width > p.x &&
                            this.y + this.height > p.y &&
                            this.y + this.height - this.vy <= p.y) {
                            this.y = p.y - this.height;
                            this.vy = 0;
                            this.grounded = true;
                        }
                    }

                    // Batas dunia bawah (Jatuh ke jurang)
                    if (this.y > 500) {
                        this.respawn();
                    }
                }

                respawn() {
                    this.lives--;
                    this.x = 50;
                    this.y = 100;
                    this.vy = 0;
                }

                draw(ctx, cameraX) {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x - cameraX, this.y, this.width, this.height);
                    
                    // Topi Mario/Luigi
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(this.x - cameraX + 4, this.y + 4, 16, 6);

                    // Nama Player
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px Courier New';
                    ctx.fillText(this.name, this.x - cameraX - 2, this.y - 6);
                }
            }

            const p1 = new Player(50, '#ef4444', 'MARIO');
            const p2 = new Player(90, '#22c55e', 'LUIGI');

            // Level Platforms
            const platforms = [
                { x: 0, y: 380, w: 700, h: 70 },
                { x: 250, y: 280, w: 100, h: 20, type: 'block' },
                { x: 400, y: 220, w: 80, h: 20, type: 'block' },
                { x: 800, y: 380, w: 600, h: 70 },
                { x: 950, y: 270, w: 120, h: 20, type: 'block' },
                { x: 1500, y: 380, w: 800, h: 70 },
                { x: 2100, y: 150, w: 40, h: 230, type: 'flag' } // Tiang Finish
            ];

            // Musuh Goomba
            const enemies = [
                { x: 450, y: 356, w: 24, h: 24, vx: -1, alive: true },
                { x: 1050, y: 356, w: 24, h: 24, vx: -1.2, alive: true }
            ];

            let cameraX = 0;

            // Main Loop Game
            function gameLoop() {
                // Update
                p1.update(inputs.p1, platforms);
                p2.update(inputs.p2, platforms);

                // Musuh
                for(let e of enemies) {
                    if(!e.alive) continue;
                    e.x += e.vx;
                    if(e.x < 350 || e.x > 680) e.vx *= -1;

                    // Cek Tabrakan P1 & P2 dengan Musuh
                    [p1, p2].forEach(p => {
                        if (p.x < e.x + e.w && p.x + p.width > e.x &&
                            p.y < e.y + e.h && p.y + p.height > e.y) {
                            if (p.vy > 0 && p.y + p.height - p.vy <= e.y + 10) {
                                e.alive = false; // Injak musuh
                                p.vy = -6;
                                p.score += 200;
                            } else {
                                p.respawn(); // Terkena musuh
                            }
                        }
                    });
                }

                // Kamera mengikuti player terdepan
                const targetCamX = Math.max(0, Math.max(p1.x, p2.x) - 300);
                cameraX += (targetCamX - cameraX) * 0.1;

                // --- RENDER ---
                ctx.fillStyle = '#5c94fc'; // Langit
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Awan
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(200 - cameraX * 0.2, 80, 30, 0, Math.PI * 2);
                ctx.arc(230 - cameraX * 0.2, 70, 40, 0, Math.PI * 2);
                ctx.arc(260 - cameraX * 0.2, 80, 30, 0, Math.PI * 2);
                ctx.fill();

                // Gambar Platform
                for (let p of platforms) {
                    if(p.type === 'block') {
                        ctx.fillStyle = '#b45309';
                        ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                        ctx.strokeStyle = '#78350f';
                        ctx.strokeRect(p.x - cameraX, p.y, p.w, p.h);
                    } else if(p.type === 'flag') {
                        ctx.fillStyle = '#cbd5e1';
                        ctx.fillRect(p.x - cameraX, p.y, 8, p.h);
                        ctx.fillStyle = '#ef4444';
                        ctx.beginPath();
                        ctx.moveTo(p.x - cameraX + 8, p.y);
                        ctx.lineTo(p.x - cameraX + 40, p.y + 15);
                        ctx.lineTo(p.x - cameraX + 8, p.y + 30);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#15803d'; // Tanah
                        ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                        ctx.fillStyle = '#86efac';
                        ctx.fillRect(p.x - cameraX, p.y, p.w, 8);
                    }
                }

                // Gambar Musuh
                for(let e of enemies) {
                    if(!e.alive) continue;
                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(e.x - cameraX, e.y, e.w, e.h);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(e.x - cameraX + 4, e.y + 4, 4, 4);
                    ctx.fillRect(e.x - cameraX + 14, e.y + 4, 4, 4);
                }

                // Gambar Players
                p1.draw(ctx, cameraX);
                p2.draw(ctx, cameraX);

                // UI Overlay Score & Lives
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Courier New';
                ctx.fillText(`MARIO P1 - SCORE: ${p1.score} LIVES: ${'❤️'.repeat(Math.max(0, p1.lives))}`, 20, 30);
                ctx.fillText(`LUIGI P2 - SCORE: ${p2.score} LIVES: ${'❤️'.repeat(Math.max(0, p2.lives))}`, 480, 30);

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }
    </script>
</body>
</html>
