<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Seni Rupa Kelas 5 SD - Multi-Device</title>
    <!-- Library jsPDF untuk Cetak PDF Nilai -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* SCREEN 1: MENU UTAMA */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 20px;
        }
        .title {
            font-size: 2.2rem;
            color: #fbbf24;
            margin-bottom: 8px;
            text-shadow: 2px 2px #000;
        }
        .subtitle {
            font-size: 1rem;
            color: #c7d2fe;
            margin-bottom: 25px;
        }
        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-role {
            padding: 18px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 200px;
        }
        .btn-role:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
        .btn-display { background: #2563eb; color: white; }
        .btn-multiplayer { background: #16a34a; color: white; }
        .btn-subtext { font-size: 0.75rem; opacity: 0.8; font-weight: normal; }

        /* SCREEN 2: INPUT NAMA & SLOT (HP) */
        #slot-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #1e1b4b;
            padding: 20px;
        }
        .input-box {
            width: 100%;
            max-width: 320px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        .input-box label {
            font-size: 0.9rem;
            color: #fbbf24;
            font-weight: bold;
        }
        .input-box input {
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid #6366f1;
            background: #0f172a;
            color: white;
            outline: none;
        }
        .slot-btn {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            margin: 8px 0;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-p1 { background: #dc2626; color: white; }
        .slot-p2 { background: #16a34a; color: white; }

        /* SCREEN 3: DISPLAY LAPTOP */
        #display-screen {
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        .hud-bar {
            height: 50px;
            background: #1e1b4b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 0.85rem;
            border-bottom: 2px solid #4338ca;
            z-index: 10;
        }
        .hud-status { display: flex; gap: 15px; }
        .player-tag { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .p1-tag { background: rgba(220, 38, 38, 0.3); color: #fca5a5; border: 1px solid #ef4444; }
        .p2-tag { background: rgba(22, 163, 74, 0.3); color: #86efac; border: 1px solid #22c55e; }
        .btn-pdf {
            background: #d97706;
            color: white;
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        #canvas-wrapper {
            flex: 1;
            width: 100%;
            height: calc(100vh - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #312e81;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* SCREEN 4: HP CONTROLLER STICK LANDSCAPE */
        #controller-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }
        .controller-header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 20px;
            z-index: 20;
        }
        
        /* D-PAD LANDSCAPE */
        .dpad-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 160px;
        }
        .dpad-btn {
            position: absolute;
            background: #334155;
            border: 2px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #f8fafc;
            border-radius: 8px;
        }
        .dpad-btn:active, .dpad-btn.active { background: #64748b; }
        .dpad-up    { top: 0; left: 52px; width: 56px; height: 55px; }
        .dpad-down  { bottom: 0; left: 52px; width: 56px; height: 55px; }
        .dpad-left  { top: 52px; left: 0; width: 55px; height: 56px; }
        .dpad-right { top: 52px; right: 0; width: 55px; height: 56px; }

        /* ACTION BUTTONS */
        .action-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 160px;
        }
        .act-btn {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            color: white;
        }
        .act-btn:active, .act-btn.active { transform: translateY(3px); }
        .btn-triangle { top: 0; left: 54px; background: #10b981; }
        .btn-square   { top: 54px; left: 0; background: #ec4899; }
        .btn-circle   { top: 54px; right: 0; background: #ef4444; }
        .btn-cross    { bottom: 0; left: 54px; background: #3b82f6; }

        #orientation-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 768px) and (orientation: portrait) {
            .mobile-mode #orientation-warning { display: flex; }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: MENU UTAMA -->
    <div id="menu-screen">
        <h1 class="title">🎨 PETUALANGAN SENI RUPA SD</h1>
        <p class="subtitle">Game Edukasi Seni Rupa Kelas 5 SD Multi-Player</p>

        <div class="btn-container">
            <button class="btn-role btn-display" onclick="selectRole('display')">
                💻 TOMBOL DISPLAY
                <span class="btn-subtext">(Untuk Layar Utama Laptop)</span>
            </button>
            <button class="btn-role btn-multiplayer" onclick="selectRole('multiplayer')">
                📱 MULTIPLAYER
                <span class="btn-subtext">(Untuk HP Controller)</span>
            </button>
        </div>
    </div>

    <!-- SCREEN 2: INPUT NAMA & SLOT (HP) -->
    <div id="slot-screen">
        <h2 style="margin-bottom: 15px; color: #fbbf24;">MASUKKAN DATA SISWA</h2>
        
        <div class="input-box">
            <label for="player-name">Nama Siswa / Kelompok:</label>
            <input type="text" id="player-name" placeholder="Contoh: Budi / Kelompok 1" maxlength="20">
        </div>

        <button id="btn-slot-p1" class="slot-btn slot-p1" onclick="claimSlot('p1')">
            <span>🎮 STICK 1 (SISWA 1)</span>
        </button>

        <button id="btn-slot-p2" class="slot-btn slot-p2" onclick="claimSlot('p2')">
            <span>🎮 STICK 2 (SISWA 2)</span>
        </button>
    </div>

    <!-- SCREEN 3: DISPLAY LAPTOP -->
    <div id="display-screen">
        <div class="hud-bar">
            <div style="font-weight: bold; color: #fbbf24;">SENI RUPA KELAS 5 SD</div>
            <div class="hud-status">
                <div id="p1-status" class="player-tag p1-tag">P1: MENUNGGU HP...</div>
                <div id="p2-status" class="player-tag p2-tag">P2: MENUNGGU HP...</div>
            </div>
            <button class="btn-pdf" onclick="downloadPDFResults()">📥 Download Nilai (PDF)</button>
        </div>
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>
    </div>

    <!-- SCREEN 4: HP CONTROLLER STICK -->
    <div id="controller-screen">
        <div class="controller-header">
            <span id="stick-title">STICK PLAYER</span>
        </div>

        <!-- D-PAD KIRI -->
        <div class="dpad-container">
            <div class="dpad-btn dpad-up" data-key="up">▲</div>
            <div class="dpad-btn dpad-left" data-key="left">◀</div>
            <div class="dpad-btn dpad-right" data-key="right">▶</div>
            <div class="dpad-btn dpad-down" data-key="down">▼</div>
        </div>

        <!-- ACTION KANAN -->
        <div class="action-container">
            <div class="act-btn btn-triangle" data-key="triangle">▲</div>
            <div class="act-btn btn-square" data-key="square">■</div>
            <div class="act-btn btn-circle" data-key="circle">●</div>
            <div class="act-btn btn-cross" data-key="cross">✖</div>
        </div>
    </div>

    <!-- WARNING ROTASI HP -->
    <div id="orientation-warning">
        <div style="font-size: 3rem; margin-bottom: 10px;">🔄</div>
        <h3>MOHON PUTAR HP KE LANDSCAPE</h3>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 10px;">Pegang HP secara mendatar untuk mengendalikan karakter.</p>
    </div>

    <script>
        // --- 1. SINKRONISASI LOKAL TANPA DATABASE ---
        const localBC = new BroadcastChannel('seni_rupa_game');

        let assignedPlayer = null;
        let p1Name = "Siswa 1";
        let p2Name = "Siswa 2";

        const inputs = {
            p1: { left: false, right: false, up: false, down: false },
            p2: { left: false, right: false, up: false, down: false }
        };

        function selectRole(role) {
            document.getElementById('menu-screen').style.display = 'none';

            if(role === 'display') {
                document.getElementById('display-screen').style.display = 'flex';
                initDisplayGame();
            } else {
                document.body.classList.add('mobile-mode');
                document.getElementById('slot-screen').style.display = 'flex';
            }
        }

        // --- 2. KONTROLER HP & INPUT NAMA MANUAL ---
        function claimSlot(slot) {
            const nameInput = document.getElementById('player-name').value.trim();
            if(!nameInput) return alert("Silakan masukkan nama siswa terlebih dahulu!");

            assignedPlayer = slot;
            const playerName = nameInput;

            // Kirim event pendaftaran nama ke Laptop
            localBC.postMessage({
                type: 'REGISTER_PLAYER',
                slot: slot,
                name: playerName
            });

            document.getElementById('slot-screen').style.display = 'none';
            document.getElementById('controller-screen').style.display = 'block';

            const titleEl = document.getElementById('stick-title');
            titleEl.innerText = `${slot.toUpperCase()} - ${playerName}`;
            titleEl.style.color = slot === 'p1' ? '#ef4444' : '#22c55e';

            setupTouchControls();
        }

        function sendInputState(key, isPressed) {
            if(!assignedPlayer) return;
            localBC.postMessage({
                type: 'INPUT',
                player: assignedPlayer,
                key: key,
                pressed: isPressed
            });
        }

        function setupTouchControls() {
            const buttons = document.querySelectorAll('.dpad-btn, .act-btn');
            buttons.forEach(btn => {
                const key = btn.getAttribute('data-key');
                if(!key) return;

                const press = (e) => {
                    if(e) e.preventDefault();
                    btn.classList.add('active');
                    if (navigator.vibrate) navigator.vibrate(12);
                    mapAndSend(key, true);
                };

                const release = (e) => {
                    if(e) e.preventDefault();
                    btn.classList.remove('active');
                    mapAndSend(key, false);
                };

                btn.addEventListener('touchstart', press, {passive: false});
                btn.addEventListener('touchend', release, {passive: false});
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
            });
        }

        function mapAndSend(key, isPressed) {
            if (key === 'left') sendInputState('left', isPressed);
            if (key === 'right') sendInputState('right', isPressed);
            if (key === 'up' || key === 'cross' || key === 'triangle') sendInputState('up', isPressed);
        }

        // --- 3. ENGINE GAME SENI RUPA (LAPTOP) ---
        let gameP1, gameP2;

        function initDisplayGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            localBC.onmessage = (e) => {
                const data = e.data;
                if(data.type === 'REGISTER_PLAYER') {
                    if(data.slot === 'p1') {
                        p1Name = data.name;
                        gameP1.name = data.name;
                        const el = document.getElementById('p1-status');
                        el.innerText = `P1: ${data.name} (CONNECTED)`;
                        el.style.background = "rgba(220, 38, 38, 0.8)";
                        el.style.color = "#fff";
                    } else if(data.slot === 'p2') {
                        p2Name = data.name;
                        gameP2.name = data.name;
                        const el = document.getElementById('p2-status');
                        el.innerText = `P2: ${data.name} (CONNECTED)`;
                        el.style.background = "rgba(22, 163, 74, 0.8)";
                        el.style.color = "#fff";
                    }
                } else if(data.type === 'INPUT') {
                    if(inputs[data.player]) inputs[data.player][data.key] = data.pressed;
                }
            };

            // Keyboard Control Laptop Fallback
            window.addEventListener('keydown', e => {
                if(e.code === 'KeyA') inputs.p1.left = true;
                if(e.code === 'KeyD') inputs.p1.right = true;
                if(e.code === 'KeyW') inputs.p1.up = true;

                if(e.code === 'ArrowLeft') inputs.p2.left = true;
                if(e.code === 'ArrowRight') inputs.p2.right = true;
                if(e.code === 'ArrowUp') inputs.p2.up = true;
            });

            window.addEventListener('keyup', e => {
                if(e.code === 'KeyA') inputs.p1.left = false;
                if(e.code === 'KeyD') inputs.p1.right = false;
                if(e.code === 'KeyW') inputs.p1.up = false;

                if(e.code === 'ArrowLeft') inputs.p2.left = false;
                if(e.code === 'ArrowRight') inputs.p2.right = false;
                if(e.code === 'ArrowUp') inputs.p2.up = false;
            });

            const gravity = 0.5;

            class Player {
                constructor(x, color, name) {
                    this.x = x;
                    this.y = 200;
                    this.width = 24;
                    this.height = 32;
                    this.vx = 0;
                    this.vy = 0;
                    this.color = color;
                    this.name = name;
                    this.grounded = false;
                    this.score = 0;
                    this.lives = 3;
                }

                update(inputState, platforms) {
                    if (inputState.left) this.vx = -3.5;
                    else if (inputState.right) this.vx = 3.5;
                    else this.vx = 0;

                    if (inputState.up && this.grounded) {
                        this.vy = -11;
                        this.grounded = false;
                    }

                    this.vy += gravity;
                    this.x += this.vx;
                    this.y += this.vy;

                    this.grounded = false;
                    for (let p of platforms) {
                        if (this.x < p.x + p.w &&
                            this.x + this.width > p.x &&
                            this.y + this.height > p.y &&
                            this.y + this.height - this.vy <= p.y) {
                            this.y = p.y - this.height;
                            this.vy = 0;
                            this.grounded = true;
                        }
                    }

                    if (this.y > 500) this.respawn();
                }

                respawn() {
                    this.lives--;
                    this.x = 50;
                    this.y = 100;
                    this.vy = 0;
                }

                draw(ctx, cameraX) {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x - cameraX, this.y, this.width, this.height);
                    
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(this.x - cameraX + 4, this.y + 4, 16, 6);

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 11px Arial';
                    ctx.fillText(this.name, this.x - cameraX - 4, this.y - 6);
                }
            }

            gameP1 = new Player(50, '#ef4444', p1Name);
            gameP2 = new Player(90, '#22c55e', p2Name);

            const platforms = [
                { x: 0, y: 380, w: 700, h: 70 },
                { x: 250, y: 280, w: 100, h: 20 },
                { x: 400, y: 220, w: 100, h: 20 },
                { x: 800, y: 380, w: 600, h: 70 },
                { x: 950, y: 270, w: 120, h: 20 },
                { x: 1500, y: 380, w: 800, h: 70 }
            ];

            // Item Karya Seni Rupa (Elemen Warna, Bentuk, Kuas)
            const artItems = [
                { x: 270, y: 240, type: '🎨 Warna Primer', points: 20, collected: false },
                { x: 420, y: 180, type: '📐 Prinsip Proporsi', points: 25, collected: false },
                { x: 980, y: 230, type: '🖼️ Seni Anyaman', points: 30, collected: false },
                { x: 1100, y: 340, type: '✏️ Ragam Hias', points: 25, collected: false }
            ];

            let cameraX = 0;

            function gameLoop() {
                gameP1.update(inputs.p1, platforms);
                gameP2.update(inputs.p2, platforms);

                // Ambil Item Seni Rupa
                for(let item of artItems) {
                    if(item.collected) continue;
                    [gameP1, gameP2].forEach(p => {
                        if (p.x < item.x + 20 && p.x + p.width > item.x &&
                            p.y < item.y + 20 && p.y + p.height > item.y) {
                            item.collected = true;
                            p.score += item.points;
                        }
                    });
                }

                const targetCamX = Math.max(0, Math.max(gameP1.x, gameP2.x) - 300);
                cameraX += (targetCamX - cameraX) * 0.1;

                // Render Background & Dunia Game
                ctx.fillStyle = '#312e81';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Platform
                for (let p of platforms) {
                    ctx.fillStyle = '#4338ca';
                    ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                    ctx.fillStyle = '#6366f1';
                    ctx.fillRect(p.x - cameraX, p.y, p.w, 6);
                }

                // Render Item
                for (let item of artItems) {
                    if(item.collected) continue;
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(item.x - cameraX + 10, item.y + 10, 10, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.font = '10px Arial';
                    ctx.fillText(item.type, item.x - cameraX - 15, item.y - 5);
                }

                // Render Player
                gameP1.draw(ctx, cameraX);
                gameP2.draw(ctx, cameraX);

                // Score HUD Top
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px Arial';
                ctx.fillText(`${gameP1.name}: ${gameP1.score} Poin | Nyawa: ${'❤️'.repeat(Math.max(0, gameP1.lives))}`, 20, 30);
                ctx.fillText(`${gameP2.name}: ${gameP2.score} Poin | Nyawa: ${'❤️'.repeat(Math.max(0, gameP2.lives))}`, 480, 30);

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }

        // --- 4. EXPORT LAPORAN HASIL NILAI KE PDF ---
        function downloadPDFResults() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const p1FinalScore = gameP1 ? Math.min(100, gameP1.score) : 0;
            const p2FinalScore = gameP2 ? Math.min(100, gameP2.score) : 0;

            // Judul PDF
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("REKAP NILAI GAME SENI RUPA KELAS 5 SD", 105, 20, { align: "center" });

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text(`Tanggal Ujian / Main: ${new Date().toLocaleDateString('id-ID')}`, 105, 28, { align: "center" });
            doc.line(20, 32, 190, 32);

            // Tabel Nilai
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text("Hasil Penilaian Siswa:", 20, 45);

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");

            // Header Tabel
            doc.setFillColor(230, 230, 230);
            doc.rect(20, 50, 170, 8, 'F');
            doc.text("No", 25, 56);
            doc.text("Nama Siswa / Player", 45, 56);
            doc.text("Nilai Akhir", 115, 56);
            doc.text("Status Kelulusan", 150, 56);

            // Baris Player 1
            doc.text("1", 25, 68);
            doc.text(p1Name, 45, 68);
            doc.text(`${p1FinalScore} / 100`, 115, 68);
            doc.text(p1FinalScore >= 70 ? "LULUS (KKM)" : "REMIDI", 150, 68);

            // Baris Player 2
            doc.text("2", 25, 78);
            doc.text(p2Name, 45, 78);
            doc.text(`${p2FinalScore} / 100`, 115, 78);
            doc.text(p2FinalScore >= 70 ? "LULUS (KKM)" : "REMIDI", 150, 78);

            doc.line(20, 85, 190, 85);

            // Catatan Guru
            doc.setFont("helvetica", "italic");
            doc.setFontSize(10);
            doc.text("* Nilai dihitung berdasarkan pengumpulan materi Seni Rupa & ketahanan nyawa karakter.", 20, 95);

            // Simpan PDF
            doc.save(`Nilai_Seni_Rupa_Kelas5_${Date.now()}.pdf`);
        }
    </script>
</body>
</html>
