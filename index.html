<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireboy & Watergirl Host Controller</title>
    <!-- Menggunakan PeerJS untuk koneksi P2P antar HP dan Laptop -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        .box { background: #333; padding: 20px; border-radius: 10px; display: inline-block; margin: 10px; }
        input { padding: 10px; font-size: 16px; width: 250px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #218838; }
        .status { font-weight: bold; margin-top: 10px; }
        .connected { color: #28a745; }
        .disconnected { color: #dc3545; }
    </style>
</head>
<body>

    <h1>🎮 Hubungkan Stik HP ke Laptop</h1>
    <p>Buka <a href="https://www.friv.com/z/games/fireboyandwatergirlforest/game.html" target="_blank" style="color: #4da6ff;">Game Fireboy & Watergirl</a> di tab lain atau layar sebelah.</p>

    <div class="box">
        <h3>Pemain 1 (Watergirl - WASD)</h3>
        <p>ID Host Anda: <span id="host-id-wg" style="color: yellow; font-weight: bold;">Memuat...</span></p>
        <p class="status disconnected" id="status-wg">Status: Menunggu HP Terhubung...</p>
        <br>
        <a id="link-wg" href="#" target="_blank"><button>Buka Controller Watergirl (HP 1)</button></a>
    </div>

    <div class="box">
        <h3>Pemain 2 (Fireboy - Panah)</h3>
        <p>ID Host Anda: <span id="host-id-fb" style="color: yellow; font-weight: bold;">Memuat...</span></p>
        <p class="status disconnected" id="status-fb">Status: Menunggu HP Terhubung...</p>
        <br>
        <a id="link-fb" href="#" target="_blank"><button>Buka Controller Fireboy (HP 2)</button></a>
    </div>

    <script>
        // Membuat ID unik acak untuk koneksi
        const uidWG = 'fbwg-wg-' + Math.random().toString(36).substring(2, 7);
        const uidFB = 'fbwg-fb-' + Math.random().toString(36).substring(2, 7);

        document.getElementById('host-id-wg').innerText = uidWG;
        document.getElementById('host-id-fb').innerText = uidFB;

        // Link otomatis mengarah ke file controller di GitHub Pages Anda dengan membawa parameter ID
        const repoPath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        document.getElementById('link-wg').href = repoPath + 'controller-watergirl.html?id=' + uidWG;
        document.getElementById('link-fb').href = repoPath + 'controller-fireboy.html?id=' + uidFB;

        // Inisialisasi PeerJS untuk Watergirl
        const peerWG = new Peer(uidWG);
        peerWG.on('connection', (conn) => {
            document.getElementById('status-wg').innerText = 'Status: Terhubung dengan HP 1! ✅';
            document.getElementById('status-wg').className = 'status connected';
            
            conn.on('data', (data) => {
                simulateKey(data.key, data.action);
            });
        });

        // Inisialisasi PeerJS untuk Fireboy
        const peerFB = new Peer(uidFB);
        peerFB.on('connection', (conn) => {
            document.getElementById('status-fb').innerText = 'Status: Terhubung dengan HP 2! ✅';
            document.getElementById('status-fb').className = 'status connected';
            
            conn.on('data', (data) => {
                simulateKey(data.key, data.action);
            });
        });

        // Fungsi untuk memicu event Keyboard secara virtual di browser laptop
        function simulateKey(key, action) {
            console.log(`Key: ${key}, Action: ${action}`);
            const eventType = action === 'down' ? 'keydown' : 'keyup';
            
            let keyCode = '';
            if (key === 'ArrowUp') keyCode = 'ArrowUp';
            if (key === 'ArrowDown') keyCode = 'ArrowDown';
            if (key === 'ArrowLeft') keyCode = 'ArrowLeft';
            if (key === 'ArrowRight') keyCode = 'ArrowRight';
            if (key === 'w' || key === 'W') keyCode = 'KeyW';
            if (key === 'a' || key === 'A') keyCode = 'KeyA';
            if (key === 's' || key === 'S') keyCode = 'KeyS';
            if (key === 'd' || key === 'D') keyCode = 'KeyD';

            const keyboardEvent = new KeyboardEvent(eventType, {
                key: key,
                code: keyCode,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(keyboardEvent);
            window.dispatchEvent(keyboardEvent);
        }
    </script>
</body>
</html>
